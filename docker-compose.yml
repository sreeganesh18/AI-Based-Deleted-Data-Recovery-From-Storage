# =============================================================================
# docker-compose.yml — AI-Based Deleted Data Recovery
# Version: Compose Spec (no version key required for modern Docker)
# =============================================================================
#
# USAGE:
#   1. Copy .env.example to .env and set DATA_DIR and CHECKPOINTS_DIR
#   2. docker compose build
#   3. docker compose up
#   4. Open http://localhost:8501 in your browser
#
# To run CLI pipeline mode:
#   docker compose run --rm app python main.py --image /data/your_disk.img
#
# =============================================================================

services:
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_recovery_ui
    ports:
      - "${STREAMLIT_HOST_PORT:-8501}:8501"
    volumes:
      - "${CHECKPOINTS_DIR:-./models/checkpoints}:/app/models/checkpoints:ro"
      - "${DATA_DIR:-./dataset}:/data:ro"
      - "${RECOVERED_DIR:-./recovered_data}:/app/recovered_data:rw"
      - fsrcnn_model_cache:/app/reconstruction/models
    environment:
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - CUDA_VISIBLE_DEVICES=""
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "com.project.name=AI-Based Deleted Data Recovery"
      - "com.project.description=Streamlit UI for AI-powered forensic file recovery"
      - "com.project.python=3.12"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_recovery_api
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+mysqlconnector://root:root@mysql:3306/forensic_ai}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - RECOVERY_DIR=${RECOVERY_DIR:-/app/evidence/recovered}
      - PYTHONUNBUFFERED=1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - "${DATA_DIR:-./dataset}:/data:ro"
      - "${RECOVERED_DIR:-./recovered_data}:/app/recovered_data:rw"

  mysql:
    image: mysql:8
    container_name: ai_recovery_mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-forensic_ai}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: ai_recovery_redis
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_recovery_worker
    command: celery -A backend.app.workers.celery_worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL:-mysql+mysqlconnector://root:root@mysql:3306/forensic_ai}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - RECOVERY_DIR=${RECOVERY_DIR:-/app/evidence/recovered}
      - PYTHONUNBUFFERED=1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.workers.celery_worker.celery_app inspect ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - "${CHECKPOINTS_DIR:-./models/checkpoints}:/app/models/checkpoints:ro"
      - "${DATA_DIR:-./dataset}:/data:ro"
      - "${RECOVERED_DIR:-./recovered_data}:/app/recovered_data:rw"

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_recovery_flower
    command: celery -A backend.app.workers.celery_worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    depends_on:
      redis:
        condition: service_started
      worker:
        condition: service_started

# =============================================================================
# Named Volumes
# =============================================================================
volumes:
  mysql_data:
    name: ai_recovery_mysql_data
  fsrcnn_model_cache:
    name: ai_recovery_fsrcnn_cache
